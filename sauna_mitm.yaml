# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml

substitutions:
  # Display Transmit Sniff pin (SP485 Pin 4 / DI):
  display_rx_pin: GPIO20
  # Power Unit Transmit Sniff pin (SP485 Pin 1 / RO):
  power_unit_rx_pin: GPIO21

esphome:
  name: sauna-controller
  friendly_name: Sauna Controller
  includes:
    - harvia_griffin.h

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

# Hardware logger uses ESP32-C3 internal USB_SERIAL_JTAG
# freeing UART0 and UART1 for Harvia RS-485 bus sniffing.
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 0

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "sauna-ctrl Fallback AP"

captive_portal:

# Root debug component required by sensor.debug
debug:

ota:
  platform: esphome
  on_progress:
    then:
      - logger.log:
          format: "OTA progress %0.1f%%"
          args: ["x"]

bluetooth_proxy:
  active: true

esp32_ble_tracker:
  scan_parameters:
    active: true

switch:
  - platform: restart
    name: "Restart Controller"

# -------------------------------------------------------------
# Dual-Channel Harvia Griffin CG170 Sniffer
# -------------------------------------------------------------
uart:
  # Channel A: Display -> Power Unit (tapped at SP485 Pin 4)
  - id: display_uart
    rx_pin:
      number: ${display_rx_pin}
      mode:
        input: true
        pullup: true
    baud_rate: 7812
    rx_buffer_size: 512
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: 60ms
      sequence:
        - lambda: |-
            UARTDebug::log_hex(direction, bytes, ' ');
            harvia_process_packet(bytes, "DISPLAY");
            id(sauna_temperature).update();
            id(sauna_target_temperature).update();
            id(sauna_timer_remaining).update();

  # Channel B: Power Unit -> Display (tapped at SP485 Pin 1)
  - id: power_unit_uart
    rx_pin:
      number: ${power_unit_rx_pin}
      mode:
        input: true
        pullup: true
    baud_rate: 7812
    rx_buffer_size: 512
    debug:
      direction: RX
      dummy_receiver: true
      after:
        timeout: 60ms
      sequence:
        - lambda: |-
            UARTDebug::log_hex(direction, bytes, ' ');
            harvia_process_packet(bytes, "PWR_UNIT");
            id(sauna_temperature).update();
            id(sauna_target_temperature).update();
            id(sauna_timer_remaining).update();

# -------------------------------------------------------------
# Home Assistant Sensors & Diagnostics
# -------------------------------------------------------------
sensor:
  - platform: template
    name: "Sauna Temperature"
    id: sauna_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:thermometer"
    lambda: |-
      if (std::isnan(g_harvia.current_temp)) return {};
      return g_harvia.current_temp;

  - platform: template
    name: "Sauna Target Temperature"
    id: sauna_target_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:thermometer-chevron-up"
    lambda: |-
      if (std::isnan(g_harvia.target_temp)) return {};
      return g_harvia.target_temp;

  - platform: template
    name: "Sauna Timer Remaining"
    id: sauna_timer_remaining
    unit_of_measurement: "min"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    lambda: |-
      if (std::isnan(g_harvia.timer_remaining_min)) return {};
      return g_harvia.timer_remaining_min;

  # Diagnostic Memory Sensors
  - platform: debug
    free:
      name: "Controller Free Memory"
      icon: "mdi:memory"
    block:
      name: "Controller Max Free Block"
      icon: "mdi:memory-arrow-down"

  - platform: template
    name: "Controller Memory Used"
    id: controller_memory_used
    entity_category: diagnostic
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:memory"
    update_interval: 60s
    lambda: |-
      return harvia_get_memory_used_pct();

binary_sensor:
  - platform: template
    name: "Sauna Heater Active"
    id: sauna_heater_state
    icon: "mdi:radiator"
    lambda: |-
      return g_harvia.heater;

  - platform: template
    name: "Sauna Light"
    id: sauna_light_state
    icon: "mdi:lightbulb"
    lambda: |-
      return g_harvia.light;

  - platform: template
    name: "Sauna Fan"
    id: sauna_fan_state
    icon: "mdi:fan"
    lambda: |-
      return g_harvia.fan;

  - platform: template
    name: "Sauna Bus Online"
    id: sauna_bus_online
    entity_category: diagnostic
    device_class: connectivity
    icon: "mdi:check-network"
    lambda: |-
      return (millis() - g_harvia.last_pu_rx_time < 15000) || (millis() - g_harvia.last_disp_rx_time < 15000);

  # Diagnostic sensor: triggers ON if Power Unit and Display ever report conflicting states
  - platform: template
    name: "Sauna State Mismatch"
    id: sauna_state_mismatch
    entity_category: diagnostic
    device_class: problem
    icon: "mdi:alert-circle-outline"
    lambda: |-
      return g_harvia.state_mismatch;
